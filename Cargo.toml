[workspace]
resolver = "2"
members = ["crates/gocoax", "crates/gocoax-exporter", "crates/gocoax-remediator"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
# hickory-dns = a pure-Rust DNS resolver that reads /etc/resolv.conf (search
# domains + ndots) itself, so short hostnames resolve correctly even in a
# static musl/scratch image (musl's libc resolver does not expand search
# domains via Docker's embedded DNS).
reqwest = { version = "0.12", default-features = false, features = ["json", "hickory-dns"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
wiremock = "0.6"

# Lightweight release binaries: strip symbols + thin LTO + single codegen unit.
# (Compile time is traded for smaller, faster binaries — a deliberate choice.)
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
